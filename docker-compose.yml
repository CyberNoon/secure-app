version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: my-app-frontend
    ports:
      - "8080:80"
    volumes:
      - ./code:/usr/share/nginx/html
    networks:
      - frontend-net
    depends_on:
      - api-service

  api-service:
    build: .
    container_name: api-bridge
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=database-secure
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASS=secret
      - MY_APP_SECRET=TajnyKluczHakerow123
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: database-secure
    environment:
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  frontend-net:
  backend-net:
